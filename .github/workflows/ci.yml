name: LLM Monitoring Dashboard CI Pipeline

# Trigger CI workflow automatically on push or pull request to main and develop
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up clean Python 3.11 environment on Linux runner
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install all required dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run SAST Security Scan (Bandit)
      - name: Run Bandit Security Scan
        run: |
          bandit -r . -x ./tests,./venv,./.pytest_cache


      # Step 5: Run automated test suite with PYTHONPATH set to root
      - name: Run Automated pytest Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v

      # Step 6: Validate Docker build
      - name: Build Docker Image
        run: |
          docker build -t llm-fastapi-app:latest .

